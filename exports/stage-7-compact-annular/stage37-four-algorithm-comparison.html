<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage 37 四算法浏览器对比</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #eef3fb; color: #17233b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; color: #66758d; font-size: 12px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 648px; }
    figure { margin: 0; min-width: 0; overflow: hidden; border: 1px solid #d7e1ef; border-radius: 12px; background: white; box-shadow: 0 3px 12px rgba(36, 58, 92, .08); }
    figcaption { height: 34px; padding: 8px 12px; font-size: 13px; font-weight: 650; border-bottom: 1px solid #e7edf6; }
    img { display: block; width: 100%; height: calc(100% - 34px); object-fit: cover; object-position: center; }
  </style>
</head>
<body>
  <header>
    <h1>第 37 阶段 · 四算法同输入对比</h1>
    <p>黄鹤楼 foot-walking · eligible 252 · 业务上游 API 0</p>
  </header>
  <main>
    <figure><figcaption>旧径向（只读基线）</figcaption><img src="stage37-baseline-geographic.png" alt="旧径向基线"></figure>
    <figure><figcaption>费马紧凑布局</figcaption><img src="stage37-fermat-compact.png" alt="费马紧凑布局"></figure>
    <figure><figcaption>泊松盘紧凑布局</figcaption><img src="stage37-poisson-compact.png" alt="泊松盘紧凑布局"></figure>
    <figure><figcaption>前沿接触式（地理匹配）</figcaption><img src="stage37-frontier-geographic.png" alt="前沿接触式地理匹配"></figure>
  </main>
</body>
</html>
